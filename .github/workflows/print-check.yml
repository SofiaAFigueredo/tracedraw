# Throwaway check for #614 (not for merging): prints the Windows print
# script, as TraceDraw runs it, on a printer that writes to a file.
name: print check
on:
  push:
    branches: [ci-print-check]
permissions:
  contents: read
jobs:
  print:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: A printer that writes to a file
        shell: pwsh
        run: |
          Set-Service Spooler -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service Spooler
          New-Item -ItemType Directory -Force C:\pc | Out-Null
          $drivers = (Get-PrinterDriver).Name
          Write-Output "::notice title=drivers::$($drivers -join ', ')"
          $driver = @("Microsoft Print To PDF", "Microsoft XPS Document Writer v4", "Microsoft Software Printer Driver") | Where-Object { $drivers -contains $_ } | Select-Object -First 1
          if (-not $driver) {
            try { Add-PrinterDriver -Name "Generic / Text Only"; $driver = "Generic / Text Only" } catch { Write-Output "::error title=driver::$($_.Exception.Message)" }
          }
          Write-Output "::notice title=driver::$driver"
          foreach ($k in "s1", "s2") {
            try {
              Add-PrinterPort -Name "C:\pc\$k.out.prn"
              Add-Printer -Name "Check $k" -DriverName $driver -PortName "C:\pc\$k.out.prn"
            } catch { Write-Output "::error title=printer $k::$($_.Exception.Message)"; exit 1 }
          }
          Get-Printer | Format-Table Name,DriverName,PortName
      - name: The scripts
        shell: pwsh
        run: Copy-Item ci-print\* C:\pc\
      - name: Print as TraceDraw does (hidden window, no profile)
        shell: pwsh
        run: |
          foreach ($k in "s1", "s2") {
            $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',"C:\pc\$k.ps1" -WindowStyle Hidden -PassThru -RedirectStandardOutput "C:\pc\$k.out" -RedirectStandardError "C:\pc\$k.err"
            $done = $p.WaitForExit(120000)
            if (-not $done) { $p.Kill(); $code = "hung (killed after 120 s)" } else { $code = $p.ExitCode }
            Start-Sleep -Seconds 10
            $size = if (Test-Path "C:\pc\$k.out.prn") { (Get-Item "C:\pc\$k.out.prn").Length } else { "no file" }
            $out = (Get-Content "C:\pc\$k.out" -Raw) -replace "`r?`n", " "
            $err = (Get-Content "C:\pc\$k.err" -Raw) -replace "`r?`n", " "
            Write-Output "::notice title=$k::exit $code; printed bytes $size; out: $out; err: $err"
          }
